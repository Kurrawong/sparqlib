# https://taskfile.dev

version: '3'

vars:
  package_name: sparqlkit

tasks:
  install:
    desc: Install project with all extras.
    cmds:
      - uv sync --all-extras

  code:check:
    desc: Check whether code formatting rules apply.
    cmds:
      - uv run ruff format --check {{.package_name}} tests
      - uv run ruff check {{.package_name}} tests
      - uv run mypy {{.package_name}} tests

  code:
    desc: Format and standardise code.
    cmds:
      - uv run ruff format {{.package_name}} tests
      - uv run ruff check --fix {{.package_name}} tests
      - uv run mypy {{.package_name}} tests

  test:
    desc: Run Python tests.
    cmds:
      - uv run pytest
